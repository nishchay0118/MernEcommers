name: Build and Deploy Wheels Backend 🚀

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/img:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/img:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v0.1.10  # stable version
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            echo "Starting deployment..."

            # Debug info
            echo "Running on host: $(hostname)"
            echo "User: $(whoami)"
            echo "Docker version: $(docker -v)"
            echo "Current containers:"
            sudo docker ps -a

            # Stop and remove old container
            echo "Stopping old container..."
            sudo docker stop contd || true
            sudo docker rm contd || true

            # Remove old image
            echo "Removing old image..."
            sudo docker rmi -f ${{ secrets.DOCKER_USERNAME }}/img:latest || true

            # Pull latest image
            echo "Pulling latest image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/img:latest

            # Run new container
            echo "Starting new container..."
            sudo docker run -d -p 5000:5000 --name contd ${{ secrets.DOCKER_USERNAME }}/img:latest

            echo "Deployment completed successfully."


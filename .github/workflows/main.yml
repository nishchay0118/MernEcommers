name: Build and Deploy Wheels Backend 🚀
 
on:
  push:
    branches:
      - master
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/img:latest .
 
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/img:latest
 
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            # Stop and remove old container
            sudo docker stop img || true
            sudo docker rm img || true
 
            # Remove old image
            sudo docker rmi -f ${{ secrets.DOCKER_USERNAME }}/img:latest || true
 
            # Pull latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/img:latest
 
            # Run new  container
            sudo docker run -d -p 5000:5000 --name contd ${{ secrets.DOCKER_USERNAME }}/img:latest
